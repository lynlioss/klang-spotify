name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Android 16's Robolectric runtime requires Java 21; shipped bytecode remains Java 17.
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.2 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate distribution
        run: |
          python3 scripts/check-plugin.py
          python3 scripts/test-import-packaging.py
      - name: Build, lint and test
        run: ./gradlew :spotify-core:test :plugin:testDebugUnitTest :plugin:lintRelease :plugin:assembleRelease --no-daemon
      - name: Verify release packaging
        run: python3 scripts/verify-import-packaging.py plugin/build/outputs/apk/release/plugin-release.apk --mapping plugin/build/outputs/mapping/release/mapping.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotify-integration-ci
          path: |
            plugin/build/outputs/apk/release/plugin-release.apk
            plugin/build/outputs/mapping/release/mapping.txt
            plugin/build/reports/
            spotify-core/build/reports/tests/
          retention-days: 14
